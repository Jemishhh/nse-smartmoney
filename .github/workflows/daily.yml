name: Daily NSE smart-money update
on:
  schedule:
    - cron: '0 3 * * *'      # 03:00 UTC = 08:30 IST, daily
  workflow_dispatch: {}       # lets you run it manually from the Actions tab
permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: pip install --quiet pandas rapidfuzz requests
      - name: Fetch new NSE deals
        run: python fetch_nse.py
      - name: Rebuild master + dashboard
        run: python nse_pipeline.py
      - name: Publish dashboard as index.html
        run: cp NSE_SmartMoney_Dashboard.html index.html
      - name: Commit & push
        run: |
          git config user.name "nse-bot"
          git config user.email "nse-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo "no changes"; else git commit -m "daily update $(date -u +%F)" && git push; fi
