name: Daily NSE smart-money update
on:
  schedule:
    - cron: '0 3 * * *'      # 03:00 UTC = 08:30 IST, daily
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: pip install --quiet pandas rapidfuzz requests
      - name: Fetch new NSE deals
        run: python fetch_nse.py
      - name: Rebuild master + dashboard
        run: python nse_pipeline.py
      - name: Publish dashboard as index.html
        run: cp NSE_SmartMoney_Dashboard.html index.html
      - name: Commit & push
        run: |
          git config user.name "nse-bot"
          git config user.email "nse-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo "no changes"; else git commit -m "daily update $(date -u +%F)" && git push; fi
      - name: Build morning email
        run: |
          python build_email.py
          echo "EMAIL_SUBJECT=$(cat email_subject.txt)" >> "$GITHUB_ENV"
      - name: Send morning email
        if: ${{ env.MAIL_ENABLED == 'true' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: NSE Smart-Money <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_USERNAME }}
          subject: ${{ env.EMAIL_SUBJECT }}
          html_body: file://email_body.html
    env:
      MAIL_ENABLED: ${{ secrets.MAIL_USERNAME != '' && 'true' || 'false' }}
